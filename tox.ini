[tox]
envlist =
    py38-pandas130-requests230
    py39-pandas140-requests231
    py310-pandas150-requests231
    py310-pandas200-requests231
    py310-pandas220-requests232
    py312-pandas220-requests232
skip_missing_interpreters = true

[testenv]
usedevelop = true
deps =
    pytest==8.2.1

[testenv:py38-pandas130-requests230]
basepython = python3.8
deps =
    {[testenv]deps}
    numpy==1.18.0
    pandas==1.0.5
    requests==2.20.0
    importlib_resources
commands = pytest tests/

[testenv:py39-pandas140-requests231]
basepython = python3.9
deps =
    {[testenv]deps}
    numpy==1.22.4
    pandas==1.4.4
    requests==2.31.0
commands = pytest tests/

[testenv:py310-pandas150-requests231]
basepython = python3.10
deps =
    {[testenv]deps}
    numpy==1.23.5
    pandas==1.5.3
    requests==2.31.0
commands = pytest tests/

[testenv:py310-pandas200-requests231]
basepython = python3.10
deps =
    {[testenv]deps}
    numpy==1.24.4
    pandas==2.0.3
    requests==2.31.0
commands = pytest tests/

[testenv:py310-pandas220-requests232]
basepython = python3.10
deps =
    {[testenv]deps}
    numpy==1.26.4
    pandas==2.2.2
    requests==2.32.4
commands = pytest tests/

[testenv:py312-pandas220-requests232]
basepython = python3.12
deps =
    {[testenv]deps}
    numpy==1.26.4
    pandas==2.2.2
    requests==2.32.4
commands = pytest tests/
